<svg xmlns="http://www.w3.org/2000/svg" width="740" height="470" viewBox="0 0 740 470">
  <rect width="740" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">case 的执行流程：从上往下逐条比较，命中一条就跳出</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 开始 -->
  <rect x="170" y="46" width="180" height="34" rx="17" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="260" y="68" font-size="13" fill="#374151" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">sel 变化，进入 case</text>

  <path d="M 260 80 L 260 106" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <!-- 判断 1 -->
  <path d="M 260 112 L 390 142 L 260 172 L 130 142 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="260" y="147" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel == 2'b00 ?</text>

  <path d="M 390 142 L 470 142" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="425" y="134" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">是</text>
  <rect x="478" y="124" width="130" height="36" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="543" y="147" font-size="12" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">y = d[0]</text>
  <text x="626" y="147" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">→ 跳出 case</text>

  <path d="M 260 172 L 260 198" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="266" y="191" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">否</text>

  <!-- 判断 2 -->
  <path d="M 260 204 L 390 234 L 260 264 L 130 234 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="260" y="239" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel == 2'b01 ?</text>

  <path d="M 390 234 L 470 234" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="425" y="226" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">是</text>
  <rect x="478" y="216" width="130" height="36" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="543" y="239" font-size="12" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">y = d[1]</text>
  <text x="626" y="239" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">→ 跳出 case</text>

  <path d="M 260 264 L 260 290" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="266" y="283" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">否</text>

  <!-- 判断 3 -->
  <path d="M 260 296 L 390 326 L 260 356 L 130 326 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="260" y="331" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel == 2'b10 ?</text>

  <path d="M 390 326 L 470 326" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="425" y="318" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">是</text>
  <rect x="478" y="308" width="130" height="36" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="543" y="331" font-size="12" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">y = d[2]</text>
  <text x="626" y="331" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">→ 跳出 case</text>

  <path d="M 260 356 L 260 382" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="266" y="375" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">否</text>

  <!-- 判断 4 -->
  <path d="M 260 388 L 390 418 L 260 448 L 130 418 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="260" y="423" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel == 2'b11 ?</text>

  <path d="M 390 418 L 470 418" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="425" y="410" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">是</text>
  <rect x="478" y="400" width="130" height="36" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="543" y="423" font-size="12" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">y = d[3]</text>
  <text x="626" y="423" font-size="11" fill="#059669" font-family="Segoe UI, Microsoft YaHei, sans-serif">→ 跳出 case</text>

  <text x="20" y="466" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">sel 只有 4 种取值，4 条分支全写了，所以最后不可能“一条都不命中”。</text>
</svg>
