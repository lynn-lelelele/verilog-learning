<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <rect width="720" height="240" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">时钟是一根不停翻转的方波，触发器只在“上升沿”看输入</text>

  <path d="M 60 140 L 120 140 L 120 90 L 180 90 L 180 140 L 240 140 L 240 90 L 300 90 L 300 140 L 360 140 L 360 90 L 420 90 L 420 140 L 480 140 L 480 90 L 540 90 L 540 140 L 600 140 L 600 90 L 660 90"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <g stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="120" y1="60" x2="120" y2="160"/>
    <line x1="240" y1="60" x2="240" y2="160"/>
    <line x1="360" y1="60" x2="360" y2="160"/>
    <line x1="480" y1="60" x2="480" y2="160"/>
    <line x1="600" y1="60" x2="600" y2="160"/>
  </g>

  <g font-size="11" fill="#dc2626" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="120" y="54">上升沿</text>
    <text x="360" y="54">上升沿</text>
    <text x="600" y="54">上升沿</text>
  </g>
  <text x="66" y="164" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">clk</text>

  <!-- 周期标注 -->
  <g stroke="#6b7280" stroke-width="1.2">
    <line x1="120" y1="186" x2="240" y2="186"/>
    <line x1="120" y1="180" x2="120" y2="192"/>
    <line x1="240" y1="180" x2="240" y2="192"/>
  </g>
  <text x="180" y="205" font-size="12" fill="#374151" text-anchor="middle" font-family="Consolas, Menlo, monospace">T（周期）</text>

  <text x="270" y="205" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">两个上升沿之间就是一个周期；高低电平各占一半时叫 50% 占空比。</text>
  <text x="60" y="228" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">真正的时钟由晶振或 PLL 产生，仿真里我们用翻转语句“人工制造”。</text>
</svg>
