<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">D 触发器：只在上升沿把当时的 d 抄到 q，其余时间 q 保持</text>

  <!-- 时钟 -->
  <path d="M 60 100 L 140 100 L 140 70 L 220 70 L 220 100 L 300 100 L 300 70 L 380 70 L 380 100 L 460 100 L 460 70 L 540 70 L 540 100 L 620 100 L 620 70 L 660 70"
        fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="20" y="92" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">clk</text>

  <!-- d -->
  <path d="M 60 190 L 180 190 L 180 160 L 340 160 L 340 190 L 500 190 L 500 160 L 660 160"
        fill="none" stroke="#d97706" stroke-width="2.2"/>
  <text x="20" y="182" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">d</text>
  <g font-size="11" fill="#92400e" font-family="Consolas, Menlo, monospace">
    <text x="100" y="184">0</text>
    <text x="250" y="154">1</text>
    <text x="410" y="184">0</text>
    <text x="570" y="154">1</text>
  </g>

  <!-- q -->
  <path d="M 60 280 L 300 280 L 300 250 L 460 250 L 460 280 L 620 280 L 620 250 L 660 250"
        fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="20" y="272" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">q</text>
  <g font-size="11" fill="#065f46" font-family="Consolas, Menlo, monospace">
    <text x="160" y="274">0</text>
    <text x="370" y="244">1</text>
    <text x="530" y="274">0</text>
    <text x="636" y="244">1</text>
  </g>

  <!-- 采样沿 -->
  <g stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="140" y1="55" x2="140" y2="290"/>
    <line x1="300" y1="55" x2="300" y2="290"/>
    <line x1="460" y1="55" x2="460" y2="290"/>
    <line x1="620" y1="55" x2="620" y2="290"/>
  </g>

  <g font-size="11" fill="#dc2626" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="146" y="70">沿1：d=0 → q=0</text>
    <text x="306" y="120">沿2：d=1 → q=1</text>
    <text x="466" y="170">沿3：d=0 → q=0</text>
    <text x="560" y="220">沿4：d=1 → q=1</text>
  </g>

  <text x="20" y="318" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">d 在两次沿之间怎么乱变都不影响 q；q 只在红色虚线处跳变一次。</text>
</svg>
