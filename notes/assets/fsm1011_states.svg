<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590">
  <rect width="720" height="590" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">1011 检测器：每个状态只回答一个问题——下一位是 0 还是 1？</text>
  <text x="20" y="52" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">方框左边是“现在已经匹配到哪一段”，右边是“收到下一位后去哪个状态”。</text>

  <defs>
    <marker id="arrow0" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow1" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="105" y="78" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">当前状态</text>
    <text x="365" y="78" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">din = 0</text>
    <text x="605" y="78" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">din = 1</text>
  </g>

  <!-- S0 -->
  <g>
    <rect x="30" y="82" width="150" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="105" y="107" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">S0</text>
    <text x="105" y="129" font-size="11" fill="#475569" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">已匹配：空</text>

    <path d="M180 115 L215 115 L215 87 L242 87" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow0)"/>
    <text x="197" y="78" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace">0</text>
    <rect x="250" y="69" width="230" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="365" y="92" font-size="12" fill="#475569" text-anchor="middle">S0 · 还是没匹配，继续等</text>

    <path d="M215 115 L215 143 L487 143" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow1)"/>
    <text x="230" y="158" font-size="11" fill="#2563eb" font-family="Consolas, Menlo, monospace">1</text>
    <rect x="495" y="125" width="195" height="36" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="592" y="148" font-size="12" fill="#1e3a8a" text-anchor="middle">S1 · 开始新的“1”</text>
  </g>

  <!-- S1 -->
  <g>
    <rect x="30" y="177" width="150" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="105" y="202" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">S1</text>
    <text x="105" y="224" font-size="11" fill="#475569" text-anchor="middle">已匹配：“1”</text>

    <path d="M180 210 L215 210 L215 182 L242 182" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow0)"/>
    <text x="197" y="173" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace">0</text>
    <rect x="250" y="164" width="230" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="365" y="187" font-size="12" fill="#475569" text-anchor="middle">S2 · 得到“10”</text>

    <path d="M215 210 L215 238 L487 238" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow1)"/>
    <text x="230" y="253" font-size="11" fill="#2563eb" font-family="Consolas, Menlo, monospace">1</text>
    <rect x="495" y="220" width="195" height="36" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="592" y="243" font-size="12" fill="#1e3a8a" text-anchor="middle">S1 · “11”的末尾仍是“1”</text>
  </g>

  <!-- S2 -->
  <g>
    <rect x="30" y="272" width="150" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="105" y="297" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">S2</text>
    <text x="105" y="319" font-size="11" fill="#475569" text-anchor="middle">已匹配：“10”</text>

    <path d="M180 305 L215 305 L215 277 L242 277" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow0)"/>
    <text x="197" y="268" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace">0</text>
    <rect x="250" y="259" width="230" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="365" y="282" font-size="12" fill="#475569" text-anchor="middle">S0 · “100”作废，回到起点</text>

    <path d="M215 305 L215 333 L487 333" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow1)"/>
    <text x="230" y="348" font-size="11" fill="#2563eb" font-family="Consolas, Menlo, monospace">1</text>
    <rect x="495" y="315" width="195" height="36" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="592" y="338" font-size="12" fill="#1e3a8a" text-anchor="middle">S3 · 得到“101”</text>
  </g>

  <!-- S3 -->
  <g>
    <rect x="30" y="367" width="150" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="105" y="392" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">S3</text>
    <text x="105" y="414" font-size="11" fill="#475569" text-anchor="middle">已匹配：“101”</text>

    <path d="M180 400 L215 400 L215 372 L242 372" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow0)"/>
    <text x="197" y="363" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace">0</text>
    <rect x="250" y="354" width="230" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="365" y="377" font-size="12" fill="#475569" text-anchor="middle">S2 · “1010”末尾仍留着“10”</text>

    <path d="M215 400 L215 428 L487 428" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow1)"/>
    <text x="230" y="443" font-size="11" fill="#2563eb" font-family="Consolas, Menlo, monospace">1</text>
    <rect x="495" y="410" width="195" height="36" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="592" y="433" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">S4 · 命中 1011</text>
  </g>

  <!-- S4 -->
  <g>
    <rect x="30" y="462" width="150" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="105" y="487" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">S4</text>
    <text x="105" y="509" font-size="11" fill="#047857" text-anchor="middle">已命中｜输出 detected=1</text>

    <path d="M180 495 L215 495 L215 467 L242 467" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow0)"/>
    <text x="197" y="458" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace">0</text>
    <rect x="250" y="449" width="230" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="365" y="472" font-size="12" fill="#475569" text-anchor="middle">S2 · 末尾变出“10”</text>

    <path d="M215 495 L215 523 L487 523" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow1)"/>
    <text x="230" y="538" font-size="11" fill="#2563eb" font-family="Consolas, Menlo, monospace">1</text>
    <rect x="495" y="505" width="195" height="36" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="592" y="528" font-size="12" fill="#1e3a8a" text-anchor="middle">S1 · 末尾的“1”还能再用</text>
  </g>

  <text x="20" y="574" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">最容易错的两处：S3 收到 0 去 S2，不是回 S0；S4 仍然有出边，所以下一串 1011 可以紧接着开始。</text>
</svg>