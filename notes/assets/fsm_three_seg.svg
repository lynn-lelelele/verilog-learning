<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">三段式：状态、次态、输出各写一段，互不干涉</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 第一段 -->
  <rect x="140" y="52" width="440" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="156" y="74" font-size="13" fill="#1e3a8a" font-family="Segoe UI, Microsoft YaHei, sans-serif">第一段 · 状态寄存器（时序）</text>
  <text x="156" y="99" font-size="12" fill="#1e3a8a" font-family="Consolas, Menlo, monospace">always @(posedge clk)  state &lt;= next_state;</text>
  <text x="156" y="120" font-size="11" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">只在时钟沿动，整个模块里唯一“记住”东西的地方</text>

  <!-- 第二段 -->
  <rect x="140" y="176" width="440" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="156" y="198" font-size="13" fill="#065f46" font-family="Segoe UI, Microsoft YaHei, sans-serif">第二段 · 次态逻辑（组合）</text>
  <text x="156" y="223" font-size="12" fill="#065f46" font-family="Consolas, Menlo, monospace">always @(*)  case (state)  ...  endcase</text>
  <text x="156" y="244" font-size="11" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">输入：当前状态 + din　　输出：next_state</text>

  <!-- 第三段 -->
  <rect x="140" y="300" width="440" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="156" y="322" font-size="13" fill="#065f46" font-family="Segoe UI, Microsoft YaHei, sans-serif">第三段 · 输出逻辑（组合，Moore）</text>
  <text x="156" y="347" font-size="12" fill="#065f46" font-family="Consolas, Menlo, monospace">assign detected = (state == S4);</text>
  <text x="156" y="368" font-size="11" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">只看状态，不看 din</text>

  <!-- 箭头：第一段 -> 第二段 -->
  <path d="M 200 132 L 200 172" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="208" y="158" font-size="11" fill="#374151" font-family="Consolas, Menlo, monospace">state</text>

  <!-- 箭头：第二段 -> 第一段 -->
  <path d="M 520 176 L 520 136" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="528" y="160" font-size="11" fill="#374151" font-family="Consolas, Menlo, monospace">next_state</text>

  <!-- 箭头：第一段 -> 第三段（右侧绕行） -->
  <path d="M 580 92 L 656 92 L 656 340 L 584 340" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="600" y="86" font-size="11" fill="#374151" font-family="Consolas, Menlo, monospace">state</text>

  <text x="20" y="410" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">三段分开写的好处：状态不跳 → 查第一、二段；状态对但输出不对 → 只查第三段。合在一起写时这三件事互相干扰。</text>
</svg>