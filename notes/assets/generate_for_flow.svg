<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">generate for：展开时复制硬件，不是运行时循环</text>
  <text x="20" y="52" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">以 WIDTH=4 为例：源码里一个 for，展开后得到 4 个 full_adder 实例。</text>

  <defs>
    <marker id="gArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="260" y="78" width="200" height="74" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.7"/>
  <text x="360" y="104" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle" font-family="Consolas, Menlo, monospace">parameter WIDTH = 4</text>
  <text x="360" y="128" font-size="11" fill="#4338ca" text-anchor="middle">展开阶段先知道循环次数</text>

  <path d="M360 152 L360 184" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#gArrow)"/>

  <rect x="205" y="194" width="310" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="360" y="217" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle" font-family="Consolas, Menlo, monospace">generate for (i = 0; i &lt; WIDTH; i = i + 1)</text>
  <text x="360" y="239" font-size="11" fill="#a16207" text-anchor="middle">i = 0, 1, 2, 3 分别生成一套端口连接</text>

  <path d="M360 252 L360 278" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#gArrow)"/>

  <rect x="24" y="288" width="150" height="72" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="99" y="314" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">u_fa[0]</text>
  <text x="99" y="337" font-size="11" fill="#047857" text-anchor="middle">a[0], b[0]</text>
  <text x="99" y="353" font-size="11" fill="#64748b" text-anchor="middle">carry[0] → carry[1]</text>

  <path d="M174 324 L198 324" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#gArrow)"/>
  <rect x="198" y="288" width="150" height="72" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="273" y="314" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">u_fa[1]</text>
  <text x="273" y="337" font-size="11" fill="#047857" text-anchor="middle">a[1], b[1]</text>
  <text x="273" y="353" font-size="11" fill="#64748b" text-anchor="middle">carry[1] → carry[2]</text>

  <path d="M348 324 L372 324" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#gArrow)"/>
  <rect x="372" y="288" width="150" height="72" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="447" y="314" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">u_fa[2]</text>
  <text x="447" y="337" font-size="11" fill="#047857" text-anchor="middle">a[2], b[2]</text>
  <text x="447" y="353" font-size="11" fill="#64748b" text-anchor="middle">carry[2] → carry[3]</text>

  <path d="M522 324 L546 324" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#gArrow)"/>
  <rect x="546" y="288" width="150" height="72" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="621" y="314" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">u_fa[3]</text>
  <text x="621" y="337" font-size="11" fill="#047857" text-anchor="middle">a[3], b[3]</text>
  <text x="621" y="353" font-size="11" fill="#64748b" text-anchor="middle">carry[3] → cout</text>

  <rect x="24" y="378" width="672" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="360" y="398" font-size="11" fill="#475569" text-anchor="middle">展开完成后，for 循环本身消失，只剩 4 个全加器组成一条进位链。</text>
</svg>