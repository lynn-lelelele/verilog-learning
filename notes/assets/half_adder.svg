<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">半加器：两个 1 位数相加</text>

  <g font-size="14" fill="#374151" font-family="Consolas, Menlo, monospace">
    <text x="22" y="124">a</text>
    <text x="22" y="164">b</text>
  </g>

  <rect x="100" y="88" width="140" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="132" font-size="14" fill="#1e3a8a" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">半加器</text>
  <text x="170" y="156" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">half_adder</text>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M 40 120 L 100 120"/>
    <path d="M 40 160 L 100 160"/>
    <path d="M 240 118 L 320 118"/>
    <path d="M 240 158 L 320 158"/>
  </g>

  <g font-size="14" fill="#14532d" font-family="Consolas, Menlo, monospace">
    <text x="328" y="123">sum（本位和）</text>
    <text x="328" y="163">cout（进位）</text>
  </g>

  <!-- 真值表 -->
  <g stroke="#9ca3af" stroke-width="1" fill="none">
    <rect x="470" y="70" width="220" height="140"/>
    <line x1="470" y1="105" x2="690" y2="105"/>
    <line x1="470" y1="140" x2="690" y2="140"/>
    <line x1="470" y1="175" x2="690" y2="175"/>
    <line x1="525" y1="70" x2="525" y2="210"/>
    <line x1="580" y1="70" x2="580" y2="210"/>
    <line x1="635" y1="70" x2="635" y2="210"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="497" y="94">a</text>
    <text x="552" y="94">b</text>
    <text x="607" y="94">sum</text>
    <text x="662" y="94">cout</text>
    <text x="497" y="129">0</text><text x="552" y="129">0</text><text x="607" y="129">0</text><text x="662" y="129">0</text>
    <text x="497" y="164">0</text><text x="552" y="164">1</text><text x="607" y="164">1</text><text x="662" y="164">0</text>
    <text x="497" y="199">1</text><text x="552" y="199">0</text><text x="607" y="199">1</text><text x="662" y="199">0</text>
    <text x="497" y="229">1</text><text x="552" y="229">1</text><text x="607" y="229">0</text><text x="662" y="229">1</text>
  </g>

  <text x="20" y="270" font-size="13" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">1 + 1 = 10：本位写 0（sum），向高位进 1（cout）。</text>
</svg>
