<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400">
  <rect width="740" height="400" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">if-else 的执行顺序：先默认值，再按 sel 从高位到低位判断</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 默认值 -->
  <rect x="270" y="42" width="200" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="370" y="64" font-size="12" fill="#92400e" text-anchor="middle" font-family="Consolas, Menlo, monospace">y = 1'b0  先给默认值</text>

  <path d="M 370 76 L 370 100" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a3)"/>

  <!-- 第一层 -->
  <path d="M 370 106 L 500 140 L 370 174 L 240 140 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="370" y="145" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel[1] 是 1 吗？</text>

  <!-- 左分支 sel[1]=0 -->
  <path d="M 240 140 L 180 140 L 180 196" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <text x="200" y="130" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">否（sel[1]=0）</text>

  <path d="M 180 202 L 290 236 L 180 270 L 70 236 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="241" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel[0] 是 1 吗？</text>

  <!-- 右分支 sel[1]=1 -->
  <path d="M 500 140 L 560 140 L 560 196" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <text x="540" y="130" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">是（sel[1]=1）</text>

  <path d="M 560 202 L 670 236 L 560 270 L 450 236 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="241" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel[0] 是 1 吗？</text>

  <!-- 叶子 -->
  <g fill="#ecfdf5" stroke="#059669">
    <rect x="30" y="310" width="110" height="36" rx="4"/>
    <rect x="220" y="310" width="110" height="36" rx="4"/>
    <rect x="420" y="310" width="110" height="36" rx="4"/>
    <rect x="610" y="310" width="110" height="36" rx="4"/>
  </g>
  <g font-size="13" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="85" y="333">y = d[0]</text>
    <text x="275" y="333">y = d[1]</text>
    <text x="475" y="333">y = d[2]</text>
    <text x="665" y="333">y = d[3]</text>
  </g>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M 150 270 L 85 310" marker-end="url(#a3)"/>
    <path d="M 210 270 L 275 310" marker-end="url(#a3)"/>
    <path d="M 530 270 L 475 310" marker-end="url(#a3)"/>
    <path d="M 590 270 L 665 310" marker-end="url(#a3)"/>
  </g>
  <g font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="96" y="292">0</text>
    <text x="248" y="292">1</text>
    <text x="494" y="292">0</text>
    <text x="638" y="292">1</text>
  </g>

  <text x="20" y="378" font-size="11" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">四条路径互斥，任何一次只会走一条；每条都以某个 y = d[x] 结束，所以不存在“没赋值”的情况。</text>
</svg>
