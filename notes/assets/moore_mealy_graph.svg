<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300">
  <rect width="780" height="300" fill="#ffffff"/>

  <!-- 左：Moore -->
  <rect x="16" y="16" width="360" height="268" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="196" y="40" font-size="13" fill="#312e81" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">Moore：输出写在节点上 λ(s)</text>

  <circle cx="90" cy="150" r="34" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="90" y="155" font-size="13" fill="#312e81" text-anchor="middle" font-family="Consolas, Menlo, monospace">S3</text>
  <text x="90" y="196" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">输出 0</text>

  <circle cx="250" cy="150" r="34" fill="#fdf2f8" stroke="#be185d" stroke-width="2.4"/>
  <text x="250" y="155" font-size="13" fill="#9d174d" text-anchor="middle" font-family="Consolas, Menlo, monospace">S4</text>
  <text x="250" y="196" font-size="10" fill="#be185d" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">输出 1</text>

  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4f46e5"/>
    </marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <line x1="124" y1="150" x2="212" y2="150" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m1)"/>
  <text x="168" y="140" font-size="11" fill="#4f46e5" text-anchor="middle" font-family="Consolas, Menlo, monospace">din=1</text>
  <text x="168" y="168" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">这次转移不带输出</text>

  <path d="M 250 116 Q 300 70 330 92" stroke="#6b7280" stroke-width="1.4" fill="none" marker-end="url(#m2)"/>
  <text x="316" y="70" font-size="10" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">→ S1</text>

  <text x="36" y="252" font-size="10.5" fill="#4b5563" font-family="Segoe UI, Microsoft YaHei, sans-serif">输出只和“现在停在哪个节点”有关</text>
  <text x="36" y="270" font-size="10.5" fill="#4b5563" font-family="Segoe UI, Microsoft YaHei, sans-serif">命中信息必须变成状态（S4）才能输出</text>

  <!-- 右：Mealy -->
  <rect x="396" y="16" width="368" height="268" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="580" y="40" font-size="13" fill="#065f46" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">Mealy：输出写在弧上 λ(s, x)</text>

  <circle cx="470" cy="150" r="34" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="470" y="155" font-size="13" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">S3</text>

  <circle cx="650" cy="110" r="30" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="650" y="115" font-size="12" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">S1</text>

  <circle cx="650" cy="200" r="30" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="650" y="205" font-size="12" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">S2</text>

  <line x1="504" y1="136" x2="616" y2="114" stroke="#be185d" stroke-width="2" marker-end="url(#m3)"/>
  <defs>
    <marker id="m3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#be185d"/>
    </marker>
  </defs>
  <text x="560" y="100" font-size="11" fill="#be185d" text-anchor="middle" font-family="Consolas, Menlo, monospace">din=1 / 输出 1</text>

  <line x1="504" y1="164" x2="616" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#m2)"/>
  <text x="560" y="196" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">din=0 / 输出 0</text>

  <text x="416" y="252" font-size="10.5" fill="#4b5563" font-family="Segoe UI, Microsoft YaHei, sans-serif">输出和“站在哪 + 来的这一位是什么”同时有关</text>
  <text x="416" y="270" font-size="10.5" fill="#4b5563" font-family="Segoe UI, Microsoft YaHei, sans-serif">不需要 S4，因为命中由 din 当场决定</text>
</svg>
