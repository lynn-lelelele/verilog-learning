<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">4 选 1 多路选择器：sel 决定把哪一路送到 y</text>

  <g font-size="13" fill="#374151" font-family="Consolas, Menlo, monospace">
    <text x="24" y="88">d[3]</text>
    <text x="24" y="128">d[2]</text>
    <text x="24" y="168">d[1]</text>
    <text x="24" y="208">d[0]</text>
  </g>

  <rect x="150" y="62" width="150" height="180" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="146" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">mux4</text>
  <text x="225" y="170" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">case (sel)</text>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M 80 84 L 150 84"/>
    <path d="M 80 124 L 150 124"/>
    <path d="M 80 164 L 150 164"/>
    <path d="M 80 204 L 150 204"/>
    <path d="M 225 242 L 225 270 L 130 270"/>
    <path d="M 300 152 L 380 152"/>
  </g>
  <text x="44" y="274" font-size="13" fill="#374151" font-family="Consolas, Menlo, monospace">sel[1:0]</text>
  <text x="388" y="157" font-size="14" fill="#14532d" font-family="Consolas, Menlo, monospace">y</text>

  <!-- 映射表 -->
  <g stroke="#9ca3af" stroke-width="1" fill="none">
    <rect x="450" y="70" width="230" height="150"/>
    <line x1="450" y1="105" x2="680" y2="105"/>
    <line x1="450" y1="140" x2="680" y2="140"/>
    <line x1="450" y1="175" x2="680" y2="175"/>
    <line x1="565" y1="70" x2="565" y2="220"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="507" y="94">sel</text>
    <text x="622" y="94">y</text>
    <text x="507" y="129">2'b00</text><text x="622" y="129">d[0]</text>
    <text x="507" y="164">2'b01</text><text x="622" y="164">d[1]</text>
    <text x="507" y="199">2'b10</text><text x="622" y="199">d[2]</text>
    <text x="507" y="234">2'b11</text><text x="622" y="234">d[3]</text>
  </g>

  <text x="20" y="292" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">右侧表格就是 case 语句逐条翻译成电路：4 个分支 = 4 条通路，sel 像开关一样选一条。</text>
</svg>
