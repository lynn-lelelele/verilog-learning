<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390">
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">一个模块模板，生成两个不同位宽的硬件</text>
  <text x="20" y="52" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">parameter 不是运行时输入，而是在例化时把 WIDTH 固定成常量。</text>

  <defs>
    <marker id="pArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="28" y="92" width="205" height="206" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="130" y="120" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" font-family="Consolas, Menlo, monospace">mux_param</text>
  <text x="130" y="144" font-size="12" fill="#4338ca" text-anchor="middle" font-family="Consolas, Menlo, monospace">#(parameter WIDTH = 8)</text>
  <text x="130" y="180" font-size="12" fill="#475569" text-anchor="middle">d0  [WIDTH-1:0]</text>
  <text x="130" y="203" font-size="12" fill="#475569" text-anchor="middle">d1  [WIDTH-1:0]</text>
  <text x="130" y="226" font-size="12" fill="#475569" text-anchor="middle">y   [WIDTH-1:0]</text>
  <line x1="52" y1="246" x2="208" y2="246" stroke="#c7d2fe" stroke-width="1"/>
  <text x="130" y="270" font-size="11" fill="#6b7280" text-anchor="middle">同一份源码 = 电路模板</text>

  <path d="M233 152 L330 125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <text x="278" y="122" font-size="11" fill="#2563eb" text-anchor="middle">覆盖 WIDTH=4</text>
  <path d="M233 238 L330 266" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#pArrow)"/>
  <text x="278" y="270" font-size="11" fill="#059669" text-anchor="middle">使用默认 WIDTH=8</text>

  <rect x="342" y="78" width="350" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="362" y="104" font-size="13" font-weight="700" fill="#1e3a8a" font-family="Consolas, Menlo, monospace">u_mux4  #(.WIDTH(4))</text>
  <text x="362" y="130" font-size="12" fill="#334155">d0/d1/y 都变成 4 位</text>
  <text x="362" y="154" font-size="12" fill="#334155">实际硬件：4-bit 2 选 1 MUX</text>

  <rect x="342" y="220" width="350" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
  <text x="362" y="246" font-size="13" font-weight="700" fill="#065f46" font-family="Consolas, Menlo, monospace">mux_param u_mux8</text>
  <text x="362" y="272" font-size="12" fill="#334155">没有写 #(...)，所以 WIDTH 用默认值 8</text>
  <text x="362" y="296" font-size="12" fill="#334155">实际硬件：8-bit 2 选 1 MUX</text>

  <rect x="28" y="330" width="664" height="42" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="44" y="356" font-size="12" fill="#92400e">关键：两个实例不是“同一个 8 位 MUX 运行时改宽度”，而是展开成两块位宽固定的独立硬件。</text>
</svg>