<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240">
  <rect width="780" height="240" fill="#ffffff"/>
  <text x="20" y="28" font-size="13" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">寄存输出（registered output）：把 Mealy 的输出再打一拍</text>

  <defs>
    <marker id="r1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="24" y="76" width="110" height="56" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="79" y="99" font-size="11" fill="#312e81" text-anchor="middle" font-family="Consolas, Menlo, monospace">state</text>
  <text x="79" y="118" font-size="11" fill="#312e81" text-anchor="middle" font-family="Consolas, Menlo, monospace">S3</text>

  <rect x="170" y="76" width="180" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="260" y="98" font-size="11" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">(state == S3) &amp;&amp; din</text>
  <text x="260" y="118" font-size="10" fill="#065f46" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">组合逻辑，会带毛刺</text>

  <rect x="386" y="70" width="130" height="68" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
  <text x="451" y="94" font-size="11" fill="#9d174d" text-anchor="middle" font-family="Consolas, Menlo, monospace">触发器 DFF</text>
  <text x="451" y="112" font-size="10" fill="#9d174d" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">clk 上升沿采样</text>
  <text x="451" y="128" font-size="10" fill="#9d174d" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">沿间保持</text>

  <rect x="552" y="76" width="120" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="612" y="99" font-size="11" fill="#92400e" text-anchor="middle" font-family="Consolas, Menlo, monospace">detected_r</text>
  <text x="612" y="118" font-size="11" fill="#92400e" text-anchor="middle" font-family="Consolas, Menlo, monospace">0 / 1</text>

  <line x1="134" y1="104" x2="166" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#r1)"/>
  <line x1="350" y1="104" x2="382" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#r1)"/>
  <line x1="516" y1="104" x2="548" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#r1)"/>

  <rect x="700" y="76" width="60" height="56" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="730" y="108" font-size="11" fill="#374151" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif">输出</text>
  <line x1="672" y1="104" x2="696" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#r1)"/>

  <text x="24" y="180" font-size="11" fill="#4b5563" font-family="Segoe UI, Microsoft YaHei, sans-serif">代价：输出延迟增加 1 个时钟周期（时序上退化为 Moore）</text>
  <text x="24" y="200" font-size="11" fill="#4b5563" font-family="Segoe UI, Microsoft YaHei, sans-serif">收益：沿与沿之间输出恒定，组合毛刺不会传出去；状态数仍保持 Mealy 的 4 个</text>
</svg>
