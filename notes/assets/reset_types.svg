<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">同样是 rst 拉高：异步立刻清零，同步要等下一个上升沿</text>

  <!-- clk -->
  <path d="M 60 100 L 140 100 L 140 70 L 220 70 L 220 100 L 300 100 L 300 70 L 380 70 L 380 100 L 460 100 L 460 70 L 540 70 L 540 100 L 620 100 L 620 70 L 660 70"
        fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="16" y="94" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">clk</text>
  <g font-size="10" fill="#2563eb" font-family="Consolas, Menlo, monospace">
    <text x="132" y="62">沿1</text>
    <text x="292" y="62">沿2</text>
    <text x="452" y="62">沿3</text>
  </g>

  <!-- rst -->
  <path d="M 60 170 L 200 170 L 200 140 L 440 140 L 440 170 L 660 170"
        fill="none" stroke="#d97706" stroke-width="2.2"/>
  <text x="16" y="164" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">rst</text>
  <text x="206" y="134" font-size="11" fill="#92400e" font-family="Segoe UI, Microsoft YaHei, sans-serif">t=200 拉高</text>
  <text x="446" y="134" font-size="11" fill="#92400e" font-family="Segoe UI, Microsoft YaHei, sans-serif">t=440 放开</text>

  <!-- q_async -->
  <path d="M 60 250 L 200 250 L 200 280 L 460 280 L 460 250 L 660 250"
        fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="16" y="264" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">异步 q</text>
  <text x="206" y="296" font-size="11" fill="#065f46" font-family="Segoe UI, Microsoft YaHei, sans-serif">立刻变 0，不等时钟</text>

  <!-- q_sync -->
  <path d="M 60 350 L 300 350 L 300 380 L 460 380 L 460 350 L 660 350"
        fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="16" y="364" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">同步 q</text>
  <text x="306" y="396" font-size="11" fill="#5b21b6" font-family="Segoe UI, Microsoft YaHei, sans-serif">一直保持到 t=300 的上升沿才清零</text>

  <g stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="200" y1="130" x2="200" y2="290"/>
    <line x1="300" y1="60" x2="300" y2="390"/>
  </g>
</svg>
