<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270">
  <rect width="720" height="270" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">sel 是“选择信号”：2 位二进制 = 一个 0~3 的编号，用来看选中哪一路</text>

  <!-- 两位 -->
  <rect x="30" y="62" width="60" height="46" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="91" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">1</text>
  <rect x="90" y="62" width="60" height="46" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="91" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">0</text>
  <text x="60" y="128" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel[1]</text>
  <text x="120" y="128" font-size="12" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">sel[0]</text>

  <path d="M 160 85 L 205 85" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ar1)"/>
  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="215" y="62" width="120" height="46" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="275" y="91" font-size="14" fill="#374151" text-anchor="middle" font-family="Consolas, Menlo, monospace">10₂ = 2</text>

  <path d="M 335 85 L 380 85" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ar1)"/>

  <rect x="390" y="62" width="140" height="46" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="460" y="91" font-size="14" fill="#065f46" text-anchor="middle" font-family="Consolas, Menlo, monospace">选中 d[2]</text>

  <!-- 四行映射 -->
  <g stroke="#9ca3af" stroke-width="1" fill="none">
    <rect x="30" y="158" width="560" height="92"/>
    <line x1="30" y1="181" x2="590" y2="181"/>
    <line x1="170" y1="158" x2="170" y2="250"/>
  </g>
  <g font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">
    <text x="45" y="176">sel[1] sel[0]</text>
    <text x="185" y="176">被选中的输入</text>
    <text x="45" y="202">0    0</text><text x="185" y="202">d[0]</text>
    <text x="45" y="220">0    1</text><text x="185" y="220">d[1]</text>
    <text x="45" y="238">1    0</text><text x="185" y="238">d[2]</text>
  </g>
  <text x="320" y="220" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">1    1  →  d[3]</text>

  <text x="610" y="200" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">sel 从哪来？</text>
  <text x="610" y="220" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">外部的输入引脚，</text>
  <text x="610" y="238" font-size="12" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">比如按键、计数器。</text>
</svg>
