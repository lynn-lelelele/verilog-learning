<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">两个触发器串联：同一行里的赋值同时发生，d 要两个沿才传到 q2</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="42" y="102" font-size="13" fill="#374151" font-family="Consolas, Menlo, monospace">d</text>
  <path d="M 60 96 L 120 96" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a4)"/>

  <rect x="130" y="66" width="120" height="60" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="94" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">FF1</text>
  <text x="190" y="112" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">q1 &lt;= d</text>

  <path d="M 250 96 L 330 96" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a4)"/>
  <text x="272" y="88" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">q1</text>

  <rect x="340" y="66" width="120" height="60" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="94" font-size="12" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace">FF2</text>
  <text x="400" y="112" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Consolas, Menlo, monospace">q2 &lt;= q1</text>

  <path d="M 460 96 L 530 96" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a4)"/>
  <text x="540" y="101" font-size="13" fill="#14532d" font-family="Consolas, Menlo, monospace">q2</text>

  <!-- 时钟 -->
  <path d="M 130 200 L 130 170 L 190 170 L 190 200 L 250 200 L 250 170 L 310 170 L 310 200 L 370 200 L 370 170 L 430 170 L 430 200 L 470 200"
        fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="88" y="192" font-size="12" fill="#374151" font-family="Consolas, Menlo, monospace">clk</text>
  <text x="136" y="164" font-size="10" fill="#2563eb" font-family="Consolas, Menlo, monospace">沿1</text>
  <text x="256" y="164" font-size="10" fill="#2563eb" font-family="Consolas, Menlo, monospace">沿2</text>
  <text x="376" y="164" font-size="10" fill="#2563eb" font-family="Consolas, Menlo, monospace">沿3</text>

  <g font-size="12" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="20" y="232">沿 1：q1 取 d，q2 取旧的 q1（此时还是 0）</text>
    <text x="20" y="252">沿 2：q1 取新的 d，q2 取上拍存下的 d —— 数据前进一格</text>
  </g>
  <text x="20" y="272" font-size="11" fill="#dc2626" font-family="Segoe UI, Microsoft YaHei, sans-serif">若把 &lt;= 写成 =，沿 1 当天 d 就窜到 q2，两个触发器缩成一拍。</text>
</svg>
