    <rect x="358" y="80" width="60" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="430" y="80" width="60" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="502" y="80" width="60" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="574" y="80" width="60" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="100" y="118" font-size="24" fill="#1e3a8a">7</text>
