  <text x="560" y="200" font-size="14" fill="#16a34a" font-family="Segoe UI, Microsoft YaHei, sans-serif">LSB 最低位</text>

  <rect x="70" y="212" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="92" y="224" font-size="13" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">高 4 位 a[7:4]</text>
