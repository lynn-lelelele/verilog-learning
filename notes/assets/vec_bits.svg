    <text x="604" y="118" font-size="24" fill="#14532d">0</text>

    <g font-size="13" fill="#6b7280">
      <text x="100" y="160">a[7]</text>
      <text x="172" y="160">a[6]</text>
      <text x="244" y="160">a[5]</text>
