<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210">
  <rect width="720" height="210" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">常量写法拆解</text>
  <g font-family="Consolas, Menlo, monospace" font-size="36">
    <text x="70" y="110" fill="#2563eb">8</text>
    <text x="95" y="110" fill="#9ca3af">'</text>
    <text x="112" y="110" fill="#ea580c">b</text>
    <text x="135" y="110" fill="#16a34a">1010_0011</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3">
    <line x1="86"  y1="122" x2="86"  y2="150"/>
    <line x1="126" y1="122" x2="126" y2="150"/>
    <line x1="330" y1="122" x2="330" y2="150"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
    <text x="20"  y="170" fill="#2563eb">位宽：共 8 位</text>
    <text x="180" y="170" fill="#ea580c">进制：b 表示二进制</text>
    <text x="390" y="170" fill="#16a34a">数值：下划线只为易读，可省略</text>
  </g>
</svg>