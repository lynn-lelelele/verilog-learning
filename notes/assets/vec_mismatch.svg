<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">位宽不匹配：变宽补 0，变窄截高位</text>

  <text x="40" y="68" font-size="14" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">① 左边比右边宽：高位补 0</text>
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <rect x="40"  y="80" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="95"  y="80" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="150" y="80" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="205" y="80" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="67"  y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="122" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="177" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="232" y="112" font-size="22" fill="#1e3a8a">1</text>

    <path d="M 272 105 L 298 105" stroke="#6b7280" stroke-width="2"/>
    <path d="M 298 105 L 288 100 L 288 110 z" fill="#6b7280"/>

    <rect x="310" y="80" width="45" height="50" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="355" y="80" width="45" height="50" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="400" y="80" width="45" height="50" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="445" y="80" width="45" height="50" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="490" y="80" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="535" y="80" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="580" y="80" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="625" y="80" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="332" y="112" font-size="22" fill="#14532d">0</text>
    <text x="377" y="112" font-size="22" fill="#14532d">0</text>
    <text x="422" y="112" font-size="22" fill="#14532d">0</text>
    <text x="467" y="112" font-size="22" fill="#14532d">0</text>
    <text x="512" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="557" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="602" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="647" y="112" font-size="22" fill="#1e3a8a">1</text>

    <g font-size="13" fill="#6b7280">
      <text x="150" y="152">4'b1111</text>
      <text x="490" y="152">y[7:0] = 0000_1111</text>
    </g>
  </g>
  <text x="310" y="68" font-size="12" fill="#16a34a" font-family="Segoe UI, Microsoft YaHei, sans-serif">绿色 4 位是自动补的 0</text>

  <text x="40" y="196" font-size="14" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">② 左边比右边窄：高位被截掉，只保留低位</text>
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <rect x="40"  y="208" width="45" height="50" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="85"  y="208" width="45" height="50" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="130" y="208" width="45" height="50" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="175" y="208" width="45" height="50" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="220" y="208" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="265" y="208" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="310" y="208" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="355" y="208" width="45" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="62"  y="240" font-size="22" fill="#7f1d1d">1</text>
    <text x="107" y="240" font-size="22" fill="#7f1d1d">0</text>
    <text x="152" y="240" font-size="22" fill="#7f1d1d">1</text>
    <text x="197" y="240" font-size="22" fill="#7f1d1d">0</text>
    <text x="242" y="240" font-size="22" fill="#1e3a8a">0</text>
    <text x="287" y="240" font-size="22" fill="#1e3a8a">1</text>
    <text x="332" y="240" font-size="22" fill="#1e3a8a">1</text>
    <text x="377" y="240" font-size="22" fill="#1e3a8a">0</text>

    <path d="M 412 233 L 438 233" stroke="#6b7280" stroke-width="2"/>
    <path d="M 438 233 L 428 228 L 428 238 z" fill="#6b7280"/>

    <rect x="450" y="208" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="505" y="208" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="560" y="208" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="615" y="208" width="55" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="477" y="240" font-size="22" fill="#1e3a8a">0</text>
    <text x="532" y="240" font-size="22" fill="#1e3a8a">1</text>
    <text x="587" y="240" font-size="22" fill="#1e3a8a">1</text>
    <text x="642" y="240" font-size="22" fill="#1e3a8a">0</text>

    <g font-size="13" fill="#6b7280">
      <text x="220" y="280">8'b1010_0110</text>
      <text x="615" y="280">y[3:0] = 0110</text>
    </g>
  </g>
  <text x="40" y="304" font-size="12" fill="#dc2626" font-family="Segoe UI, Microsoft YaHei, sans-serif">红色 4 位被丢弃</text>

  <text x="40" y="330" font-size="13" fill="#374151" font-family="Segoe UI, Microsoft YaHei, sans-serif">两种过程都不报错，只在仿真里静默发生，所以两边位宽要手动对齐。</text>
</svg>