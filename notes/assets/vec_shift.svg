<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310">
  <rect width="720" height="310" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" fill="#1f2937" font-family="Segoe UI, Microsoft YaHei, sans-serif">左移 2 位：位宽不变，高位丢弃，低位补 0</text>

  <text x="24" y="66" font-size="14" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">a = 1001_0110</text>
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <rect x="90"  y="80" width="60" height="50" fill="#fecaca" stroke="#dc2626"/>
    <rect x="150" y="80" width="60" height="50" fill="#fecaca" stroke="#dc2626"/>
    <rect x="210" y="80" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="270" y="80" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="330" y="80" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="390" y="80" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
