    <text x="240" y="112" font-size="22" fill="#1e3a8a">0</text>
    <text x="300" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="360" y="112" font-size="22" fill="#1e3a8a">0</text>
    <text x="420" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="480" y="112" font-size="22" fill="#1e3a8a">1</text>
    <text x="540" y="112" font-size="22" fill="#1e3a8a">0</text>

    <rect x="90"  y="220" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="150" y="220" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="210" y="220" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="270" y="220" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="330" y="220" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="390" y="220" width="60" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="450" y="220" width="60" height="50" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="510" y="220" width="60" height="50" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="120" y="252" font-size="22" fill="#1e3a8a">0</text>
    <text x="180" y="252" font-size="22" fill="#1e3a8a">1</text>
    <text x="240" y="252" font-size="22" fill="#1e3a8a">0</text>
    <text x="300" y="252" font-size="22" fill="#1e3a8a">1</text>
    <text x="360" y="252" font-size="22" fill="#1e3a8a">1</text>
    <text x="420" y="252" font-size="22" fill="#1e3a8a">0</text>
    <text x="480" y="252" font-size="22" fill="#14532d">0</text>
    <text x="540" y="252" font-size="22" fill="#14532d">0</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <line x1="240" y1="132" x2="120" y2="218"/>
    <line x1="300" y1="132" x2="180" y2="218"/>
    <line x1="360" y1="132" x2="240" y2="218"/>
    <line x1="420" y1="132" x2="300" y2="218"/>
    <line x1="480" y1="132" x2="360" y2="218"/>
    <line x1="540" y1="132" x2="420" y2="218"/>
  </g>

  <text x="24" y="196" font-size="14" fill="#6b7280" font-family="Segoe UI, Microsoft YaHei, sans-serif">y = 0101_1000</text>
  <text x="90" y="296" font-size="13" fill="#dc2626" font-family="Segoe UI, Microsoft YaHei, sans-serif">红：移出边界被丢弃</text>
  <text x="330" y="296" font-size="13" fill="#16a34a" font-family="Segoe UI, Microsoft YaHei, sans-serif">绿：低位补进来的 0</text>
